{% extends "layout.html" %}
{% block content %}
  {% for post in posts %}
  <article class="content-section py-3 px-4 mb-4">
    <div class="d-flex align-items-start gap-4">
        <img class="rounded-circle article-img flex-shrink-0"
            src="{{ url_for('static', path='profile_pics/default.jpg') }}"
            alt="{{ post.author.username }}'s profile picture"
            width="64"
            height="64"
            loading="lazy">

        <div class="flex-grow-1">
            <div class="article-metadata mb-2">
                <a class="me-2" href="#">{{post.author.username}}</a>
                <small class="text-body-secondary">{{post.date_posted}}</small>
            </div>
            <h2>
                <a class="article-title" href="#">{{post.title}}</a>
            </h2>
            <p class="article-text">{{post.text}}</p>

            {% for reply in post.replies %}
                <div class="article-metadata mb-2">
                    <a class="me-2" href="#">{{reply.author.username}}</a>
                    <small class="text-body-secondary">{{reply.date_posted}}</small>
                </div>
                <p class="article-text">{{reply.text}}</p>
            {% endfor %}
        </div>
    </div>
  </article>
  {% endfor %}
{% endblock content %}
